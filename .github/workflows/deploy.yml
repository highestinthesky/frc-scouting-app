# Builds the SvelteKit app and publishes it to GitHub Pages on every push to main.
# Uses the official Pages actions — no third-party tokens, no gh-pages branch.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without making a new commit.
  workflow_dispatch:

# Required by actions/deploy-pages to publish to the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue up overlapping deploys; cancel any in-flight one when a new push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # For a user/org Pages site (https://3419.github.io), deploy at the domain root.
          # Leaving BASE_PATH empty keeps all app URLs rooted at "/".
          BASE_PATH: ""
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
