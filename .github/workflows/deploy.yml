# Builds the SvelteKit app and publishes it to GitHub Pages on every push to main.
# Uses the official Pages actions — no third-party tokens, no gh-pages branch.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without making a new commit.
  workflow_dispatch:

# Required by actions/deploy-pages to publish to the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue up overlapping deploys; cancel any in-flight one when a new push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: GitHub deprecated the Node 20 runner and now forces every
          # action that targets it onto 24, which shows up as an annotation on
          # every green run. Pinning the build to 22 keeps the warning off and
          # keeps the version explicit — an unpinned `node-version` would move
          # under the repo without a commit.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Parse every migration against the real PostgreSQL grammar (libpg_query).
      # A stray quote in a migration is otherwise only discovered by pasting it
      # into the Supabase SQL editor and watching it fail halfway through,
      # leaving the database partly migrated.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SQL
        run: |
          pip install pglast
          npm run check:sql

      - name: Build
        env:
          # For a project Pages site (https://highestinthesky.github.io/frc-scouting-app),
          # set BASE_PATH to the repository subpath so app routes/assets resolve correctly.
          BASE_PATH: "/frc-scouting-app"
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
