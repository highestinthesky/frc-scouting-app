# Builds the SvelteKit app and publishes it to GitHub Pages on every push to main.
# Uses the official Pages actions — no third-party tokens, no gh-pages branch.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without making a new commit.
  workflow_dispatch:

# Required by actions/deploy-pages to publish to the Pages environment.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't queue up overlapping deploys; cancel any in-flight one when a new push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # The Node the BUILD runs on. Explicit, because an unpinned version
          # would move under the repo without a commit.
          #
          # This is NOT what the Node 20 deprecation annotation was about — that
          # is the runtime each ACTION declares in its own action.yml, which is
          # fixed by the `uses:` bumps below, not here. Bumping this alone left
          # the annotation exactly where it was.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # Parse every migration against the real PostgreSQL grammar (libpg_query).
      # A stray quote in a migration is otherwise only discovered by pasting it
      # into the Supabase SQL editor and watching it fail halfway through,
      # leaving the database partly migrated.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate SQL
        run: |
          pip install pglast
          npm run check:sql

      - name: Build
        env:
          # For a project Pages site (https://highestinthesky.github.io/frc-scouting-app),
          # set BASE_PATH to the repository subpath so app routes/assets resolve correctly.
          BASE_PATH: "/frc-scouting-app"
        run: npm run build

      - name: Upload Pages artifact
        # v4 stopped including dotfiles in the artifact, and `build/.nojekyll`
        # is a dotfile. v5 adds the opt-in back, so the bump and the flag have to
        # land together — taking v5 without it would silently drop the file and
        # the failure would surface as `_app/` 404ing, not as a red run.
        uses: actions/upload-pages-artifact@v5
        with:
          path: build
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
